<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Orchestra · 工业 AI 编排与执行平台</title>
<style>
  :root {
    --bg-primary: #f5f7fc;
    --bg-secondary: #f4f6fb;
    --bg-sidebar: #f7f7f7;
    --bg-card: #ffffff;
    --bg-card-hover: #f4f6fb;
    --border: #e8eaed;
    --accent: #ff00a5;
    --accent-hover: #ff33b3;
    --accent-soft: rgba(255, 0, 165, 0.11);
    --accent-ring: rgba(255, 0, 165, 0.28);
    --text-1: #1f2129;
    --text-2: #5b606a;
    --text-3: #8a919d;
    --success: #00b578;
    --error: #fa5151;
    --warning: #ff8f1f;
    --info: #07b9b9;
    --hover-bg: rgba(31, 33, 41, 0.05);
    --shadow-sm: 0 1px 3px rgba(31, 33, 41, 0.07);
    --shadow-md: 0 10px 28px rgba(31, 33, 41, 0.08);
    --radius: 8px;
    --radius-lg: 14px;
    --font-ui: "PingFang SC", "SF Pro Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  html.dark {
    --bg-primary: #202124;
    --bg-secondary: #292a2d;
    --bg-sidebar: #2b2d33;
    --bg-card: #303134;
    --bg-card-hover: #3c4043;
    --border: #3c4043;
    --text-1: #f1f3f6;
    --text-2: #b4bac4;
    --text-3: #8a919d;
    --hover-bg: rgba(255, 255, 255, 0.06);
    --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.35);
    --shadow-md: 0 14px 32px rgba(0, 0, 0, 0.42);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; font-family: var(--font-ui); background: var(--bg-primary); color: var(--text-1); -webkit-font-smoothing: antialiased; font-size: 13px; }
  button, input { font-family: inherit; }

  /* Studio wrapper when ?mode=studio */
  body.is-studio {
    background:
      radial-gradient(ellipse 50% 60% at 18% 20%, rgba(255, 0, 165, 0.16), transparent 65%),
      radial-gradient(ellipse 48% 55% at 84% 82%, rgba(7, 185, 185, 0.15), transparent 65%),
      linear-gradient(rgba(255, 255, 255, 0.028) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(90deg, rgba(255, 255, 255, 0.028) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(135deg, #070a14 0%, #0e1324 52%, #090e1c 100%);
    display: flex; flex-direction: column; padding: 14px 18px 16px; gap: 12px;
  }
  .studio-bar {
    display: none; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    padding: 10px 14px; border-radius: 14px;
    background: linear-gradient(165deg, rgba(20, 24, 40, 0.88), rgba(12, 16, 28, 0.94));
    border: 1px solid rgba(255, 255, 255, 0.11); color: #f1f5f9; flex: none;
  }
  body.is-studio .studio-bar { display: flex; }
  .studio-bar__left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
  .studio-badge {
    font: 600 10px/1 var(--font-mono); letter-spacing: 1.2px; color: #ff5cc6;
    padding: 5px 9px; border-radius: 999px; background: rgba(255, 0, 165, 0.12);
    border: 1px solid rgba(255, 0, 165, 0.36); white-space: nowrap;
  }
  .studio-spotlight { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .studio-spotlight strong { font: 600 11px/1.3 var(--font-mono); color: #5cf2d0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .studio-spotlight span { font-size: 12px; color: #cbd5e1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .studio-pills { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .studio-pill {
    height: 28px; padding: 0 11px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.14);
    background: rgba(255, 255, 255, 0.04); color: #cbd5e1; font-size: 11.5px; font-weight: 500;
    cursor: pointer; transition: all .18s ease; white-space: nowrap;
  }
  .studio-pill:hover { border-color: rgba(255, 0, 165, 0.55); color: #fff; background: rgba(255, 0, 165, 0.1); }
  .studio-pill.active { border-color: #ff00a5; background: rgba(255, 0, 165, 0.22); color: #fff; font-weight: 600; }

  .studio-frame {
    flex: 1; min-height: 0; width: 100%; height: 100%; display: flex; flex-direction: column;
    overflow: hidden; background: var(--bg-primary);
  }
  body.is-studio .studio-frame {
    border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.14);
    box-shadow: 0 28px 70px rgba(0, 0, 0, 0.58), 0 0 0 1px rgba(255, 0, 165, 0.12);
  }
  .mac-chrome {
    display: none; height: 34px; flex: none; padding: 0 14px; align-items: center; gap: 10px;
    background: #1a1c23; border-bottom: 1px solid rgba(255, 255, 255, 0.08); color: #94a3b8;
    font: 11px/1 var(--font-mono);
  }
  body.is-studio .mac-chrome { display: flex; }
  .mac-dots { display: flex; gap: 6px; }
  .mac-dots i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .mac-dots i:nth-child(1) { background: #ff5f57; }
  .mac-dots i:nth-child(2) { background: #febc2e; }
  .mac-dots i:nth-child(3) { background: #28c840; }
  .mac-url {
    flex: 1; max-width: 420px; margin: 0 auto; height: 22px; border-radius: 6px;
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08);
    display: flex; align-items: center; justify-content: center; gap: 6px; color: #cbd5e1; font-size: 11px;
  }
  .mac-url b { color: #ff5cc6; font-weight: 600; }

  /* Main Orchestra Shell */
  .app-shell { flex: 1; min-height: 0; display: flex; width: 100%; overflow: hidden; background: var(--bg-primary); }

  /* Left Sidebar (Authentic PageSidebarNav) */
  .sidebar {
    width: 224px; flex: none; background: var(--bg-sidebar); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 12px 10px; gap: 8px; overflow: hidden;
    transition: width .22s ease;
  }
  .sidebar.collapsed { width: 58px; padding: 12px 8px; }
  .sb-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 8px; border-bottom: 1px solid var(--border); }
  .sb-logo { height: 22px; display: block; object-fit: contain; }
  .sb-mark { width: 24px; height: 24px; display: none; object-fit: contain; }
  .sidebar.collapsed .sb-logo { display: none; }
  .sidebar.collapsed .sb-mark { display: block; margin: 0 auto; }
  .sb-collapse-btn {
    width: 26px; height: 26px; border: 0; border-radius: 6px; background: transparent;
    color: var(--text-2); cursor: pointer; display: grid; place-items: center;
  }
  .sb-collapse-btn:hover { background: var(--hover-bg); color: var(--text-1); }
  .sidebar.collapsed .sb-collapse-btn { display: none; }

  .sb-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; scrollbar-width: none; }
  .sb-scroll::-webkit-scrollbar { display: none; }
  .sb-group-title {
    font-size: 11px; font-weight: 600; color: var(--text-3); padding: 4px 10px; letter-spacing: .03em;
    display: flex; align-items: center; justify-content: space-between;
  }
  .sidebar.collapsed .sb-group-title { display: none; }
  .sb-nav-item {
    width: 100%; height: 34px; padding: 0 10px; border: 0; border-radius: 10px;
    background: transparent; color: var(--text-2); font-size: 12.5px; font-weight: 500;
    display: flex; align-items: center; gap: 9px; cursor: pointer; text-align: left;
    transition: background .15s ease, color .15s ease; position: relative;
  }
  .sb-nav-item svg { width: 15px; height: 15px; flex: none; stroke-width: 1.75; }
  .sb-nav-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sb-nav-item:hover { background: var(--hover-bg); color: var(--text-1); }
  .sb-nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .sb-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: auto; flex: none; animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:.35; transform:scale(.85); } 50% { opacity:1; transform:scale(1.15); } }
  .sidebar.collapsed .sb-nav-item { justify-content: center; padding: 0; }
  .sidebar.collapsed .sb-nav-item span, .sidebar.collapsed .sb-dot { display: none; }

  .sb-foot {
    flex: none; padding-top: 8px; border-top: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .sb-user { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .sb-ava {
    width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(135deg, #ff00a5, #7c3aed);
    color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; flex: none;
  }
  .sb-user-meta { min-width: 0; }
  .sb-user-meta b { display: block; font-size: 12px; color: var(--text-1); line-height: 1.2; }
  .sb-user-meta small { display: block; font-size: 10.5px; color: var(--success); }
  .sidebar.collapsed .sb-user-meta { display: none; }
  .theme-btn {
    width: 28px; height: 28px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg-card); color: var(--text-2); cursor: pointer; display: grid; place-items: center; flex: none;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* Main Workspace */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
  .topbar {
    height: 48px; flex: none; padding: 0 16px; background: var(--bg-card); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar-title { font-size: 14.5px; font-weight: 650; color: var(--text-1); white-space: nowrap; }
  .ws-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 6px;
    background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-2);
    font-size: 11px; font-family: var(--font-mono); white-space: nowrap;
  }
  .ws-chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--success); display: block; }
  .topbar-actions { display: flex; align-items: center; gap: 8px; }
  .btn {
    height: 30px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-card); color: var(--text-1); font-size: 12px; font-weight: 500;
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: all .15s ease; white-space: nowrap;
  }
  .btn:hover { background: var(--bg-card-hover); border-color: var(--accent-ring); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
  .btn-success { background: var(--success); border-color: var(--success); color: #fff; font-weight: 600; }
  .btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }

  .view-body { flex: 1; min-height: 0; display: flex; overflow: hidden; position: relative; }

  /* ============ 1. WORKFLOW VIEW ============ */
  .wf-canvas {
    flex: 1; min-width: 0; position: relative; overflow: auto;
    background-color: var(--bg-primary);
    background-image: radial-gradient(var(--border) 1.25px, transparent 1.25px);
    background-size: 22px 22px;
    padding: 28px 24px;
  }
  .wf-stage { position: relative; width: 1040px; height: 460px; margin: 0 auto; }
  .wf-edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .wf-edge { fill: none; stroke: var(--info); stroke-width: 2.2; stroke-dasharray: 6 5; animation: dash 1.2s linear infinite; pointer-events: stroke; cursor: pointer; transition: stroke .18s ease, stroke-width .18s ease, opacity .18s ease; }
  .wf-edge:hover, .wf-edge.is-unlink-hover { stroke: #fa5151 !important; stroke-width: 3.4 !important; filter: drop-shadow(0 0 8px rgba(250,81,81,.65)); }
  .wf-edge.is-cut { opacity: 0; pointer-events: none; }
  .wf-edge.is-done { stroke: var(--success); stroke-dasharray: none; animation: none; }
  .wf-edge.is-wait { stroke: var(--warning); }
  @keyframes dash { to { stroke-dashoffset: -22; } }

  .wf-node {
    position: absolute; width: 192px; border-radius: 10px; background: var(--bg-card);
    border: 1.5px solid var(--border); box-shadow: var(--shadow-sm); cursor: pointer;
    transition: border-color .2s, box-shadow .2s, transform .2s;
  }
  .wf-node:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-md); }
  .wf-node.selected { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft), var(--shadow-md); }
  .wf-node.st-running { border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.16); }
  .wf-node.st-pending { border-color: var(--warning); box-shadow: 0 0 0 3px rgba(255, 143, 31, 0.18); }
  .wf-node.st-done { border-color: rgba(0, 181, 120, 0.55); }
  .wf-node-hd {
    padding: 9px 11px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .wf-node-hd b { font-size: 12.5px; color: var(--text-1); font-weight: 650; }
  .wf-status-pill {
    font: 600 10px/1 var(--font-mono); padding: 3px 6px; border-radius: 999px;
    background: var(--bg-secondary); color: var(--text-2); white-space: nowrap;
  }
  .st-done .wf-status-pill { background: rgba(0,181,120,.14); color: var(--success); }
  .st-running .wf-status-pill { background: rgba(37,99,235,.14); color: #2563eb; }
  .st-pending .wf-status-pill { background: rgba(255,143,31,.16); color: #d97706; }
  .wf-node-bd { padding: 9px 11px; display: flex; flex-direction: column; gap: 7px; }
  .wf-meta-row { display: flex; align-items: center; justify-content: space-between; font-size: 11px; color: var(--text-2); }
  .wf-meta-row code { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; }
  .wf-prompt { font-size: 11px; line-height: 1.45; color: var(--text-2); background: var(--bg-secondary); padding: 6px 8px; border-radius: 6px; }
  .wf-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .wf-tag { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: var(--bg-secondary); border: 1px solid var(--border); color: var(--text-2); }
  .wf-handle { position: absolute; top: 50%; width: 9px; height: 9px; border-radius: 50%; background: var(--bg-card); border: 2px solid var(--info); transform: translateY(-50%); }
  .wf-handle.in { left: -5px; }
  .wf-handle.out { right: -5px; }

  .wf-runs {
    width: 256px; flex: none; background: var(--bg-card); border-left: 1px solid var(--border);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .panel-hd {
    padding: 11px 13px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; font-size: 12.5px; font-weight: 650;
  }
  .panel-list { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
  .run-card {
    padding: 9px 10px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-secondary); display: flex; flex-direction: column; gap: 4px; cursor: pointer;
  }
  .run-card.active { border-color: var(--accent); background: var(--accent-soft); }
  .run-card-top { display: flex; align-items: center; justify-content: space-between; font-size: 11.5px; font-weight: 600; }
  .run-card small { font-size: 10.5px; color: var(--text-3); font-family: var(--font-mono); }
  .ev-box { border-top: 1px solid var(--border); padding: 10px 12px; background: var(--bg-card); display: flex; flex-direction: column; gap: 6px; max-height: 46%; overflow-y: auto; }
  .ev-title { font-size: 11.5px; font-weight: 650; color: var(--text-1); display: flex; justify-content: space-between; }
  .ev-row {
    padding: 7px 8px; border-radius: 6px; background: var(--bg-secondary); border: 1px solid var(--border);
    font-size: 11px; display: flex; flex-direction: column; gap: 2px;
  }
  .ev-row b { color: var(--text-1); font-size: 11.5px; }
  .ev-row span { color: var(--text-2); line-height: 1.4; }
  .gate-banner {
    margin: 8px 10px 0; padding: 9px 10px; border-radius: 8px;
    background: rgba(255, 143, 31, 0.12); border: 1px solid rgba(255, 143, 31, 0.4);
    display: flex; flex-direction: column; gap: 7px; font-size: 11.5px;
  }
  .gate-actions { display: flex; gap: 6px; }

  /* ============ 2. CHAT VIEW ============ */
  .chat-wrap { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .chat-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-feed { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 14px; }
  .msg { max-width: 82%; padding: 11px 14px; border-radius: 12px; font-size: 12.5px; line-height: 1.65; }
  .msg.user { align-self: flex-end; background: var(--accent-soft); border: 1px solid var(--accent-ring); color: var(--text-1); }
  .msg.ai { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
  .tool-call {
    margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: var(--bg-secondary);
    border: 1px solid var(--border); font-family: var(--font-mono); font-size: 11px; color: var(--text-2);
  }
  .tool-call b { color: var(--info); }
  .confirm-card {
    margin-top: 10px; padding: 10px 12px; border-radius: 8px;
    background: rgba(255, 143, 31, 0.1); border: 1px solid rgba(255, 143, 31, 0.35);
    display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .chat-input-bar {
    flex: none; padding: 10px 18px 14px; background: var(--bg-card); border-top: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 8px;
  }
  .quick-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .quick-chip {
    font-size: 11px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--bg-secondary); color: var(--text-2); cursor: pointer;
  }
  .quick-chip:hover { border-color: var(--accent); color: var(--accent); }
  .composer { display: flex; gap: 8px; }
  .composer input {
    flex: 1; height: 36px; padding: 0 12px; border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--bg-primary); color: var(--text-1); outline: none; font-size: 12.5px;
  }
  .composer input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }

  /* ============ 3. GENERIC GRID VIEWS (Skills, Models, Jobs, Usage, Ontology, AppBuilder) ============ */
  .page-pad { flex: 1; overflow-y: auto; padding: 18px 22px; display: flex; flex-direction: column; gap: 16px; }
  .kpi-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kpi-card {
    padding: 14px 16px; border-radius: var(--radius); background: var(--bg-card);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 4px;
  }
  .kpi-card span { font-size: 11.5px; color: var(--text-2); }
  .kpi-card strong { font-size: 22px; font-weight: 700; font-family: var(--font-mono); color: var(--text-1); }
  .kpi-card small { font-size: 11px; color: var(--success); }

  .card-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
  .card-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
  .card {
    padding: 14px 15px; border-radius: var(--radius); background: var(--bg-card);
    border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px;
  }
  .card-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-hd b { font-size: 13px; color: var(--text-1); }
  .card p { font-size: 12px; line-height: 1.55; color: var(--text-2); }
  .pill-tag {
    font: 600 10.5px/1 var(--font-mono); padding: 3px 7px; border-radius: 6px;
    background: var(--bg-secondary); color: var(--text-2); border: 1px solid var(--border);
  }
  .pill-tag.pink { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-ring); }
  .pill-tag.green { background: rgba(0,181,120,.12); color: var(--success); border-color: rgba(0,181,120,.3); }
  .pill-tag.cyan { background: rgba(7,185,185,.12); color: var(--info); border-color: rgba(7,185,185,.3); }

  .switch {
    width: 34px; height: 19px; border-radius: 999px; border: 0; background: var(--border);
    position: relative; cursor: pointer; transition: background .18s; flex: none;
  }
  .switch::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px;
    border-radius: 50%; background: #fff; transition: transform .18s;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(15px); }

  .filter-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .filter-tab {
    height: 28px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--border);

  function bezierPath(x1, y1, x2, y2) {
    const gap = x2 - x1;
    // Silky horizontal S-curve with proportional control handles (never kinks backward)
    const dx = gap >= 0
      ? Math.max(22, Math.min(72, gap * 0.48))
      : Math.max(48, Math.min(96, Math.abs(gap) * 0.35));
    return `M ${x1.toFixed(1)} ${y1.toFixed(1)} C ${(x1 + dx).toFixed(1)} ${y1.toFixed(1)}, ${(x2 - dx).toFixed(1)} ${y2.toFixed(1)}, ${x2.toFixed(1)} ${y2.toFixed(1)}`;
  }

  function getNodeAnchor(nid, side) {

    return {
      x: side === 'out' ? pos.x + w : pos.x,
      y: pos.y + h * 0.5
    };
  }

      }).join('');

  function waitMs(ms, token) {
    return new Promise(resolve => {

  }

  function glideCursorTo(tx, ty, dur, token, onStep) {
    const c = $('demoCursor');
    if (!c) return Promise.resolve(false);
    c.classList.add('is-on');
    const sx = cursorPos.x, sy = cursorPos.y;
    const t0 = performance.now();
    return new Promise(resolve => {
      function frame(now) {
        if (token.cancelled) return resolve(false);
        const p = Math.min(1, (now - t0) / Math.max(1, dur));
        const e = 1 - Math.pow(1 - p, 3);
        const cx = sx + (tx - sx) * e;
        const cy = sy + (ty - sy) * e;
        cursorPos.x = cx; cursorPos.y = cy;
        c.style.transform = `translate3d(${cx.toFixed(1)}px, ${cy.toFixed(1)}px, 0)`;
        if (onStep) onStep(p, e, cx, cy);
        if (p < 1) requestAnimationFrame(frame);
        else resolve(true);
      }
      requestAnimationFrame(frame);
    });
  }

  function getElCenter(selectorOrEl) {
    const el = typeof selectorOrEl === 'string' ? document.querySelector(selectorOrEl) : selectorOrEl;

    const r = el.getBoundingClientRect();
    if (!r.width && !r.height) return null;
    return { el, x: r.left + r.width * 0.5, y: r.top + r.height * 0.5, rect: r };
  }

  async function cursorClickEl(selectorOrEl, caption, token, dur = 560) {

    if (token.cancelled) return false;
    info.el.click();
    if (c) c.classList.remove('is-down');
    await waitMs(220, token);
    return !token.cancelled;
  }

      render();
      await waitMs(380, token);

        await cursorClickEl('#wfZoomIn', '继续放大至 106%，准备拖拽节点与拉线', token, 260);
        if (token.cancelled) return;
        await waitMs(340, token);
      } else {
        state.wfZoom = 1.06; state.wfPanX = -18; state.wfPanY = -6;
        applyWfTransform(true);
        await waitMs(520, token);
      }

      // 2. Cursor grabs Node 02 and physically drags it down-right (edges flex live)
      const n2Info = getElCenter('.wf-node[data-nid="n2"] .wf-node-hd');
      if (n2Info && !token.cancelled) {
        setDemoCaption('按住拖拽节点卡片，贝塞尔连线实时跟随');
        await glideCursorTo(n2Info.x, n2Info.y, 580, token);
        if (token.cancelled) return;
        const c = $('demoCursor');
        const n2El = document.querySelector('.wf-node[data-nid="n2"]');
        if (c) c.classList.add('is-down');
        if (n2El) n2El.classList.add('is-dragging');
        const sx = state.wfPos.n2.x, sy = state.wfPos.n2.y;
        const dxStage = 26, dyStage = 78;
        const targetScreenX = n2Info.x + dxStage * state.wfZoom;
        const targetScreenY = n2Info.y + dyStage * state.wfZoom;
        await glideCursorTo(targetScreenX, targetScreenY, 880, token, (p, e) => {
          state.wfPos.n2.x = sx + dxStage * e;
          state.wfPos.n2.y = sy + dyStage * e;
          if (n2El) { n2El.style.left = state.wfPos.n2.x + 'px'; n2El.style.top = state.wfPos.n2.y + 'px'; }
          redrawWfEdges();
        });
        if (c) c.classList.remove('is-down');
        if (n2El) n2El.classList.remove('is-dragging');
        if (token.cancelled) return;
        await waitMs(340, token);
      }

      // 3. Logical Disconnect -> Reconnect on real edge 02 -> 03
      const h2Out = getElCenter('.wf-node[data-nid="n2"] .wf-handle.out');

  function bindWfCanvasInteractions() {
    const canvas = $('wfCanvas');
    const stage = $('wfStage');
    if (!canvas || !stage) return;
    redrawWfEdges();
    applyWfTransform(false);

    if (!showCanvasBar) return;

    [['wfEdge1', 'e1'], ['wfEdge2', 'e2'], ['wfEdge3', 'e3']].forEach(([eid, key]) => {
      const edgeEl = $(eid);
      if (edgeEl) {
        edgeEl.onclick = (e) => {
          e.stopPropagation();
          if (e.isTrusted) {
            try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'orch-user-interact' }, '*'); } catch (err) {}
            stopWfCanvasDemo();
          }
          state.wfEdgeActive[key] = false;
          redrawWfEdges();
          showToast('已断开连线，可从上游节点右侧圆点重新拖线连接');
        };
      }
    });

    const notifyParentInteract = () => {
      try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'orch-user-interact' }, '*'); } catch (err) {}
    };

    const zIn = $('wfZoomIn'), zOut = $('wfZoomOut'), zReset = $('wfZoomReset'), zDemo = $('wfCanvasDemoBtn');
    if (zIn) zIn.onclick = (e) => {
      e.stopPropagation();
      if (e.isTrusted) { notifyParentInteract(); stopWfCanvasDemo(); }
      state.wfZoom = Math.min(1.45, +(state.wfZoom + 0.16).toFixed(2));
      applyWfTransform(true);
    };
    if (zOut) zOut.onclick = (e) => {
      e.stopPropagation();
      if (e.isTrusted) { notifyParentInteract(); stopWfCanvasDemo(); }
      state.wfZoom = Math.max(0.58, +(state.wfZoom - 0.16).toFixed(2));
      applyWfTransform(true);
    };
    if (zReset) zReset.onclick = (e) => {
      e.stopPropagation();
      if (e.isTrusted) { notifyParentInteract(); stopWfCanvasDemo(); }
      resetWfCanvasGeometry(true);
    };
    if (zDemo) zDemo.onclick = (e) => {
      e.stopPropagation();
      if (e.isTrusted) notifyParentInteract();
      runWfCanvasDemo({ includeApprove: false, loop: false });
    };

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      if (e.isTrusted) { notifyParentInteract(); stopWfCanvasDemo(); }
      const delta = e.deltaY < 0 ? 0.08 : -0.08;
      state.wfZoom = Math.min(1.45, Math.max(0.58, +(state.wfZoom + delta).toFixed(2)));
      applyWfTransform(false);
    }, { passive: false });

    canvas.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.wf-zoom-bar')) return;
      if (e.isTrusted) { notifyParentInteract(); stopWfCanvasDemo(); }
      stage.classList.remove('is-anim');

      const handle = e.target.closest('.wf-handle.out');
      if (handle) {
        e.stopPropagation();
        const srcNode = handle.closest('.wf-node');
        const srcId = srcNode ? srcNode.dataset.nid : null;
        if (!srcId) return;
        const pv = $('wfPreviewEdge');
        const p1 = getNodeAnchor(srcId, 'out');
        handle.classList.add('is-hot');
        if (pv) pv.style.display = 'block';
        let targetId = null;

        const onMove = (ev) => {
          const rect = stage.getBoundingClientRect();
          const mx = (ev.clientX - rect.left) / state.wfZoom;
          const my = (ev.clientY - rect.top) / state.wfZoom;
          if (pv) pv.setAttribute('d', bezierPath(p1.x, p1.y, mx, my));
          document.querySelectorAll('.wf-node').forEach(n => n.classList.remove('is-link-target'));
          const hit = document.elementFromPoint(ev.clientX, ev.clientY);
          const tn = hit ? hit.closest('.wf-node') : null;
          if (tn && tn.dataset.nid !== srcId) {
            targetId = tn.dataset.nid;
            tn.classList.add('is-link-target');
          } else {
            targetId = null;
          }
        };
        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          handle.classList.remove('is-hot');
          if (pv) pv.style.display = 'none';
          document.querySelectorAll('.wf-node').forEach(n => n.classList.remove('is-link-target'));
          if (targetId) {
            if (srcId === 'n1' && targetId === 'n2') { state.wfEdgeActive.e1 = true; }
            else if (srcId === 'n2' && targetId === 'n3') { state.wfEdgeActive.e2 = true; }
            else if (srcId === 'n3' && targetId === 'n4') { state.wfEdgeActive.e3 = true; }
            else if (!state.wfExtraEdges.some(([a, b]) => a === srcId && b === targetId)) {
              state.wfExtraEdges.push([srcId, targetId]);
            }
            redrawWfEdges();
          }
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        return;
      }

      const nodeEl = e.target.closest('.wf-node');
      if (nodeEl) {
        e.stopPropagation();
        const nid = nodeEl.dataset.nid;
        const startClientX = e.clientX, startClientY = e.clientY;
        const origX = state.wfPos[nid].x, origY = state.wfPos[nid].y;
        let moved = false;

        const onMove = (ev) => {
          const dx = (ev.clientX - startClientX) / state.wfZoom;
          const dy = (ev.clientY - startClientY) / state.wfZoom;
          if (!moved && Math.hypot(dx, dy) > 3) {
            moved = true;
            nodeEl.classList.add('is-dragging');
          }
          if (moved) {
            state.wfPos[nid].x = Math.max(8, Math.min(840, origX + dx));
            state.wfPos[nid].y = Math.max(8, Math.min(300, origY + dy));
            nodeEl.style.left = state.wfPos[nid].x + 'px';
            nodeEl.style.top = state.wfPos[nid].y + 'px';
            redrawWfEdges();
          }
        };
        const onUp = () => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          nodeEl.classList.remove('is-dragging');
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
        return;
      }

      canvas.classList.add('is-panning');
      const startX = e.clientX, startY = e.clientY;
      const origPanX = state.wfPanX, origPanY = state.wfPanY;
      const onMove = (ev) => {
        state.wfPanX = origPanX + (ev.clientX - startX);
        state.wfPanY = origPanY + (ev.clientY - startY);
        applyWfTransform(false);
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        canvas.classList.remove('is-panning');
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }

  function render() {
    try {
      if (window.parent && window.parent !== window && state.view === 'workflow') {
        window.parent.postMessage({ type: 'orch-stage', stage: state.wfStage, evidenceChecked: state.evidenceChecked, node: state.selectedNode }, '*');
      }
    } catch (e) {}
    const cur = VIEWS.find(v => v.id === state.view) || VIEWS[0];
    $('pageTitle').textContent = cur.title;
    let backBtn = $('backToWfBtn');
    if (cur.id !== 'workflow') {
      if (!backBtn) {
        backBtn = document.createElement('button');
        backBtn.id = 'backToWfBtn';
        backBtn.className = 'btn wf-back-btn';
        backBtn.type = 'button';
        backBtn.textContent = '← 返回异常处理（#RUN-1042）';
        backBtn.addEventListener('click', () => setView('workflow'));
        const tl = document.querySelector('.topbar-left');
        if (tl) tl.prepend(backBtn);
      }
    } else if (backBtn) {
      backBtn.remove();
    }
    $('wsTag').textContent = cur.ws;
    $('urlSlug').textContent = cur.id;
    renderSidebar();
    syncBrand();
    if (cur.id === 'workflow') renderWorkflow();
    else if (cur.id === 'chat') renderChat();
    else if (cur.id === 'skills') renderSkills();
    else if (cur.id === 'app-builder') renderAppBuilder();
    else if (cur.id === 'models') renderModels();
    else if (cur.id === 'jobs') renderJobs();
    else if (cur.id === 'usage') renderUsage();
    else renderOntology();
    const mc = $('mainContent') || document.querySelector('.main-body') || document.querySelector('main');
    if (mc) {
      mc.classList.remove('view-anim');
      void mc.offsetWidth;
      mc.classList.add('view-anim');
    }
    
    if (typeof window.__orchAnimateMetrics === 'function') setTimeout(window.__orchAnimateMetrics, 30);
  }

  $('collapseBtn').addEventListener('click', () => $('sidebar').classList.toggle('collapsed'));
  $('themeBtn').addEventListener('click', () => { document.documentElement.classList.toggle('dark'); syncBrand(); });
  window.addEventListener('hashchange', () => {
    const next = location.hash.replace(/^#\/?/, '').split('?')[0];
    if (VIEWS.some(v => v.id === next)) { state.view = next; render(); }
  });
  window.addEventListener('message', e => {
    const d = e && e.data;
    if (!d || typeof d !== 'object') return;
    if (d.type === 'orch-nav' && d.view && VIEWS.some(v => v.id === d.view)) {
      cancelAllDemos();
      setView(d.view);
    } else if (d.type === 'orch-reset-idle') {
      state.view = 'workflow';
      state.wfStage = 'idle';
      state.evidenceChecked = false;
      state.selectedNode = 'n1';
      render();
    } else if (d.type === 'orch-set-stage' && d.stage) {
      cancelAllDemos();
      state.wfZoom = DEFAULT_WF_ZOOM; state.wfPanX = DEFAULT_WF_PANX; state.wfPanY = DEFAULT_WF_PANY;
      state.wfPos = DEFAULT_WF_POS();
      state.wfExtraEdges = [];
    state.wfEdgeActive = { e1: true, e2: true, e3: true };
      state.view = 'workflow';
      state.wfStage = d.stage;
      state.evidenceChecked = Boolean(d.evidenceChecked);
      if (d.node) state.selectedNode = d.node;
      render();
    } else if (d.type === 'orch-canvas-demo') {
      runWfCanvasDemo({ includeApprove: false, loop: false });
    } else if (d.type === 'orch-nav' && d.view && VIEWS.some(v => v.id === d.view)) {
      cancelAllDemos();
      setView(d.view);
    } else if (d.type === 'orch-theme' && (d.theme === 'dark' || d.theme === 'light')) {
      document.documentElement.classList.toggle('dark', d.theme === 'dark');
      syncBrand();
    }
  });
  render();
  document.addEventListener('pointerdown', (e) => {

    setTimeout(() => runWfCanvasDemo({ includeApprove: true, loop: true }), 700);
  } else if (autoMode === 'chat') {
    setTimeout(() => runChatAutoDemo(), 900);
  } else if (autoMode === 'tools') {
    setTimeout(() => runToolsAutoDemo(), 950);
  }
})();

  // === Live Dynamic Numbers & Breathing Bars inside Orchestra Demo ===
  (function orchDemoLiveMetrics(){
    function animateVisibleNums(){
      document.querySelectorAll('.kpi-val, .stat-num, .metric-v, .usage-big').forEach(el => {
        if (el.dataset.animating) return;
        const txt = el.textContent.trim();
        const m = txt.match(/^([^\d]*)(\d+(?:\.\d+)?)(.*)$/);
        if (!m) return;
        const pre = m[1], target = parseFloat(m[2]), suf = m[3];
        const dec = (m[2].split('.')[1] || '').length;
        el.dataset.animating = '1';
        const t0 = performance.now();
        const dur = 750;
        const step = now => {
          const p = Math.min(1, (now - t0) / dur);
          const ease = 1 - Math.pow(1 - p, 3);
          el.textContent = pre + (target * ease).toFixed(dec) + suf;
          if (p < 1) requestAnimationFrame(step);
          else { el.textContent = txt; delete el.dataset.animating; }
        };
        requestAnimationFrame(step);
      });
    }
    window.__orchAnimateMetrics = animateVisibleNums;
    window.addEventListener('hashchange', () => setTimeout(animateVisibleNums, 60));
    setTimeout(animateVisibleNums, 160);
    setInterval(() => {
      document.querySelectorAll('.bar-fill, .prog-fill, .usage-bar i').forEach(b => {
        const cur = parseFloat(b.style.width || b.style.height || '60');
        if (!isNaN(cur)) {
          const next = Math.max(18, Math.min(96, cur + (Math.random() - 0.5) * 10));
          if (b.style.height) b.style.height = next.toFixed(0) + '%';
          else if (b.style.width) b.style.width = next.toFixed(0) + '%';
        }
      });
    }, 2200);
  })();


  // v3.4.0 Enhanced Visible Live Chart & KPI Rolling Animation
  (function initVisibleLiveCharts(){
    const frames = [
      { kpis: ['98.4%', '3', '18m'], bars: [78, 88, 94, 54, 86, 96] },
      { kpis: ['97.8%', '4', '16m'], bars: [72, 82, 91, 46, 80, 92] },
      { kpis: ['98.9%', '2', '15m'], bars: [84, 92, 96, 62, 90, 98] },
      { kpis: ['98.1%', '3', '19m'], bars: [76, 85, 89, 50, 84, 94] }
    ];
    let fi = 0;
    function rollNumber(el, targetStr) {
      const m = targetStr.match(/^([\d.]+)(.*)$/);
      if (!m) { el.textContent = targetStr; return; }
      const to = parseFloat(m[1]), suf = m[2] || '';
      const curM = (el.textContent || '').match(/^([\d.]+)/);
      const from = curM ? parseFloat(curM[1]) : Math.max(0, to - 6);
      const dec = m[1].includes('.') ? 1 : 0;
      const t0 = performance.now(), dur = 680;
      const step = (now) => {
        const p = Math.min(1, (now - t0) / dur);
        const ease = 1 - Math.pow(1 - p, 3);
        el.textContent = (from + (to - from) * ease).toFixed(dec) + suf;
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }
    function tickChart() {
      const f = frames[fi % frames.length];
      fi++;
      // Find App Builder chart bars (the 6 magenta vertical bars)
      const barEls = document.querySelectorAll('.ab-bars .ab-bar, .chart-bars .bar, .bar-col .bar-fill, .mini-bars i, [style*="linear-gradient"][style*="height"]');
      let bi = 0;
      barEls.forEach(el => {
        if (el.offsetHeight > 0 && el.offsetWidth >= 14 && el.offsetWidth <= 70 && bi < f.bars.length) {
          el.style.transition = 'height .72s cubic-bezier(.22,1,.36,1)';
          el.style.height = f.bars[bi] + '%';
          bi++;
        }
      });
      // Animate visible KPI numbers in App Builder / Usage
      const kpiEls = document.querySelectorAll('.ab-kpi b, .kpi-card .kpi-v, .kpi-val, .ab-stat b');
      kpiEls.forEach((el, idx) => {
        if (idx < f.kpis.length) rollNumber(el, f.kpis[idx]);
      });
    }
    setTimeout(tickChart, 400);
    setInterval(tickChart, 2800);
  })();
